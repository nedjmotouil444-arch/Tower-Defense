name: "Godot Android Build"

on:
  push:
    branches:
      - main

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Godot Android Export
        uses: chickenandpork/godot-export-action@v1
        with:
          godot_version: "4.2.1"
          export_preset: "Android"
          export_path: "build/android/game.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/android/game.apk
          
